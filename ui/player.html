<button id="ieum-listen" type="button" aria-label="답변 듣기" style="width:100%;min-height:72px;font-size:22px;border:2px solid #1671c5;border-radius:12px;background:#eaf4ff;color:#102f50">▶ 답변 듣기</button>
<p id="ieum-play-status" role="status" aria-live="polite" style="font-size:20px;color:#384454"></p>
<script>(()=>{const b=document.getElementById('ieum-listen');const s=document.getElementById('ieum-play-status');b.onclick=async()=>{try{const a=document.querySelector('audio[data-testid="stAudio"]');if(!a)throw Error();if(a.ended)a.currentTime=0;await a.play();s.textContent='🔊 답변을 읽고 있어요. 음성 중지로 멈출 수 있어요.';a.onended=()=>s.textContent='안내가 끝났어요.';}catch(_){s.textContent='소리를 재생하지 못했어요. 재생기의 ▶를 누르거나 화면의 글을 확인해 주세요.';}}})();</script>
